<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee shop</title>
    <link rel="icon" type="image/svg" href="assets/header_assets/coffee_cup_icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <a class="brand" href="#top" aria-label="Resource Coffee home">
            <img src="assets/header_assets/logo.svg" alt="logo icon" aria-hidden="true">
        </a>

        <nav class="desktop-nav" aria-label="Primary navigation">
            <a href="#coffee">Favorite coffee</a>
            <a href="#about">About</a>
            <a href="#app">Mobile app</a>
            <a href="#contact">Contact us</a>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
                <span class="theme-icon sun">
                    <img src="assets/header_assets/Light.svg" alt="ligh toggle">
                </span>
                <span class="theme-icon moon">
                    <img src="assets/header_assets/Dark.svg" alt="dark toggle">
                </span>
            </button>
            <button class="menu">
                <img class="menu-icon" src="assets/header_assets/burger_menu_icon.svg" alt="burger menu icon">
            </button>
        </div>
    </header>
    <main>
        <section>
            <h2>First section</h2>
        </section>
        <section>
            <h2>Second section</h2>
        </section>
    </main>
    <footer>
        <h2>Footer</h2>
    </footer>
</body>
</html>
